name: "Ecowitt MQTT Bridge Add-on"
version: "0.9.0"
slug: ecowitt_mqtt_bridge
description: "Parses Ecowitt MQTT uploads and (optional) LAN API to publish per-sensor HA MQTT Discovery."
arch:
  - aarch64
  - amd64
  - armv7
startup: application
init: false
host_network: true

options:
  broker: "core-mosquitto"
  port: 1883
  username: ""
  password: ""
  in_topic: "ecowitt/#"
  discovery_prefix: "homeassistant"
  state_prefix: "ecowitt_ha"
  client_id: "ecowitt-bridge"
  cleanup: false
  use_local_api: false
  gateway_base_url: ""
  lan_timeout: 3.0
  map_refresh_sec: 600
  publish_lan_common: false

schema:
  broker: str
  port: int
  username: str?
  password: str?
  in_topic: str
  discovery_prefix: str
  state_prefix: str
  client_id: str
  cleanup: bool
  use_local_api: bool
  gateway_base_url: str
  lan_timeout: float
  map_refresh_sec: int
  publish_lan_common: bool

# optional hübschere Darstellung im Add-on-Store:
panel_icon: "mdi:weather-partly-rainy"


